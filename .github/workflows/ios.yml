name: iOS 26 build and phone checks
on:
  workflow_dispatch:
  push:
    branches: [main, ios-v1.0.4]
    paths: ['ios/**', '.github/workflows/ios.yml', 'bank.json', 'source/**']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml', 'bank.json', 'source/**']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode and project
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 ios/tools/generate_project.py
          git diff --exit-code -- ios/HuadianQuiz.xcodeproj ios/Info.plist ios/PrivacyInfo.xcprivacy
          plutil -lint ios/HuadianQuiz.xcodeproj/project.pbxproj ios/Info.plist
      - name: Compile app and test bundles
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p ios/build
          xcodebuild build-for-testing -project ios/HuadianQuiz.xcodeproj -scheme HuadianQuiz -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build/DerivedData ARCHS=arm64 CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/build/compile.txt
      - name: Create iPhone 13 Pro simulator
        timeout-minutes: 10
        run: python3 ios/tools/select_simulator.py
      - name: Run persistence and quiz logic tests
        timeout-minutes: 5
        run: |
          set -o pipefail
          xcodebuild test-without-building -project ios/HuadianQuiz.xcodeproj -scheme HuadianQuiz -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath ios/build/DerivedData -resultBundlePath ios/build/UnitTests.xcresult -only-testing:HuadianQuizTests -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 60 CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/build/unit-tests.txt
      - name: Run iPhone interface tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building -project ios/HuadianQuiz.xcodeproj -scheme HuadianQuiz -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath ios/build/DerivedData -resultBundlePath ios/build/PhoneTests.xcresult -only-testing:HuadianQuizUITests -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/build/tests.txt
      - name: Export simulator screenshots
        if: always()
        run: |
          mkdir -p ios/build/screenshots
          if [ -d ios/build/PhoneTests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/PhoneTests.xcresult --output-path ios/build/screenshots
          fi
      - name: Archive arm64 device build
        run: |
          set -o pipefail
          xcodebuild archive -project ios/HuadianQuiz.xcodeproj -scheme HuadianQuiz -configuration Release -destination 'generic/platform=iOS' -archivePath ios/build/HuadianQuiz.xcarchive -derivedDataPath ios/build/ReleaseData CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/build/archive.txt
          python3 ios/tools/package_ipa.py ios/build/HuadianQuiz.xcarchive ios/build/output
          python3 ios/tools/verify_ipa.py ios/build/output/huadian-quiz-room-v1.0.4-ios26-build10402.ipa --build 10402
      - name: Upload IPA and verification info
        uses: actions/upload-artifact@v4
        with:
          name: huadian-ios26-ipa
          path: |
            ios/build/output/*.ipa
            ios/build/output/*.sha256
            ios/build/output/build-info.json
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-phone-test-evidence
          path: |
            ios/build/compile.txt
            ios/build/unit-tests.txt
            ios/build/tests.txt
            ios/build/archive.txt
            ios/build/screenshots/
            ios/build/PhoneTests.xcresult/
            ios/build/UnitTests.xcresult/
          retention-days: 14
      - name: Upload screenshots separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-phone-screenshots
          path: |
            ios/build/screenshots/*.png
            ios/build/screenshots/*.txt
            ios/build/screenshots/manifest.json
            ios/build/compile.txt
            ios/build/unit-tests.txt
            ios/build/tests.txt
          retention-days: 14
