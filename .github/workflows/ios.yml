name: iOS 26 build and phone checks
on:
  workflow_dispatch:
  push:
    branches: [ios-v1.0.4]
    paths: ['ios/**', '.github/workflows/ios.yml', 'bank.json', 'source/**']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml', 'bank.json', 'source/**']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode and project
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 ios/tools/generate_project.py
          git diff --exit-code -- ios/HuadianQuiz.xcodeproj ios/Info.plist ios/PrivacyInfo.xcprivacy
          plutil -lint ios/HuadianQuiz.xcodeproj/project.pbxproj ios/Info.plist
      - name: Create iPhone 13 Pro simulator
        run: python3 ios/tools/select_simulator.py
      - name: Compile and test the native phone app
        run: |
          set -o pipefail
          mkdir -p ios/build
          xcodebuild test -project ios/HuadianQuiz.xcodeproj -scheme HuadianQuiz -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath ios/build/DerivedData -resultBundlePath ios/build/PhoneTests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/build/tests.txt
      - name: Export simulator screenshots
        if: always()
        run: |
          mkdir -p ios/build/screenshots
          if [ -d ios/build/PhoneTests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/PhoneTests.xcresult --output-path ios/build/screenshots
          fi
      - name: Archive arm64 device build
        run: |
          set -o pipefail
          xcodebuild archive -project ios/HuadianQuiz.xcodeproj -scheme HuadianQuiz -configuration Release -destination 'generic/platform=iOS' -archivePath ios/build/HuadianQuiz.xcarchive -derivedDataPath ios/build/ReleaseData CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios/build/archive.txt
          python3 ios/tools/package_ipa.py ios/build/HuadianQuiz.xcarchive ios/build/output
      - name: Upload IPA and verification info
        uses: actions/upload-artifact@v4
        with:
          name: huadian-ios26-ipa
          path: |
            ios/build/output/*.ipa
            ios/build/output/*.sha256
            ios/build/output/build-info.json
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-phone-test-evidence
          path: |
            ios/build/tests.txt
            ios/build/archive.txt
            ios/build/screenshots/
            ios/build/PhoneTests.xcresult/
          retention-days: 14
